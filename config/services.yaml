- 小组件:
    - 今日头条:
        widget:
            type: customapi
            url: https://api.boycot.top/api/hots?name=toutiao
            method: GET
            display: dynamic-list
            mappings:
                items: data
                label: title
                name: hots
                target: https://www.toutiao.com/trending/{id}
                limit: 14
    - 36kr:
        widget:
            type: customapi
            url: https://api.boycot.top/api/hots?name=36kr
            method: GET
            display: dynamic-list
            mappings:
                items: data
                label: title
                name: hots
                target: https://www.36kr.com/p/{id}
                limit: 9
    - 掘金:
        widget:
            type: customapi
            url: https://api.boycot.top/api/hots?name=juejin
            method: GET
            display: dynamic-list
            mappings:
                items: data
                label: title
                name: hots
                target: https://www.juejin.cn/post/{id}
                limit: 10
    - 日程:
        widgets:
            - type: calendar
            - type: metingjs
              playId: 3778678

- 影视热播:
    - 电影:
        widget:
            type: customapi
            url: http://movie.boycot.top/api.php/provide/vod/?ac=list
            method: GET
            display: dynamic-list
            mappings:
                items: list
                label: vod_name
                name: vod_remarks
                target: http://movie.boycot.top/index.php/vod/detail/id/{vod_id}.html
                limit: 6
    - 电视剧:
        widget:
            type: customapi
            url: http://movie.boycot.top/api.php/provide/vod/?ac=list&t=13

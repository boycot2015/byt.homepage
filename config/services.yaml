- 小组件:
    - 股票行情:
        icon: mdi-chart-line-variant
        widget:
            type: customapi
            url: https://ak.boycot.top/api/public/stock_zh_index_spot_em?symbol=沪深重要指数
            # url: https://ak.boycot.top/api/public/fund_etf_spot_em
            method: GET
            refreshInterval: 30000
            display: dynamic-list
            mappings:
                # items: data
                format: number
                color: adaptive
                label: 名称
                name:
                    field: 最新价
                    format: float
                    color: theme
                additionalField:
                    field: 涨跌幅
                    format: float
                    color: adaptive
                    suffix: '%'
                # extra: 涨跌额
                # target: https://www.36kr.com/p/{id}
                limit: 7
    - 热股排行:
        icon: mdi-chart-line
        widget:
            type: customapi
            url: https://ak.boycot.top/api/public/stock_hot_rank_em
            method: GET
            refreshInterval: 30000
            display: dynamic-list
            mappings:
                # items: data
                label: 股票名称
                name:
                    field: 最新价
                    format: float
                    color: theme
                additionalField:
                    field: 涨跌幅
                    format: float
                    color: adaptive
                    suffix: '%'
                # additionalField:
                #     field: 最新价
                # target: https://www.36kr.com/p/{id}
                limit: 7
    - 格隆汇:
        icon: https://cdn.gelonghui.com/static/web/www.ico.la.ico
        widget:
            type: customapi
            url: https://api.boycot.top/api/hots?name=gelonghui
            method: GET
            refreshInterval: 15000
            display: dynamic-list
            mappings:
                items: data
                label: title
                name: hots
                target: https://www.gelonghui.com{id}
                limit: 5
    - 日程:
        icon: mdi-calendar-range
        widgets:
            - type: metingjs
              playId: 19723756
              mini: true
              fixed: true
              playtheme: '#333'
            - type: calendar

